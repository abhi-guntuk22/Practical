<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Company Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f1f3f5;
}

.navbar{
    background:#212529;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
}

.navbar input{
    padding:8px;
}

.navbar button{
    padding:8px 12px;
    background:#28a745;
    border:none;
    color:white;
}

.cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    padding:20px;
}

.card{
    width:220px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
    text-align:center;
}

</style>
</head>

<body>

<div class="navbar">

    <h2>🏢 Tech Company</h2>

    <div>
        <input type="text" placeholder="Search">
        <button>Search</button>
    </div>

</div>

<h2 style="padding-left:20px;">Company Dashboard</h2>

<div class="cards">

    <div class="card">

        <h3>150</h3>
        <p>Employees</p>

    </div>

    <div class="card">

        <h3>25</h3>
        <p>Projects</p>

    </div>

    <div class="card">

        <h3>10</h3>
        <p>Departments</p>

    </div>

    <div class="card">

        <h3>₹12L</h3>
        <p>Revenue</p>

    </div>

</div>

</body>
</html>
