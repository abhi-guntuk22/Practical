<!DOCTYPE html>
<html>
<head>
  <title>Feedback Form</title>

  <!-- jQuery Mobile CDN -->
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
  <script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>

<body>

<!-- PAGE -->
<div data-role="page" id="feedback">

  <!-- HEADER -->
  <div data-role="header">
    <h1>Feedback Form</h1>
  </div>

  <!-- CONTENT -->
  <div data-role="content">
    <form>

      <!-- Name -->
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name">

      <!-- Email -->
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email">

      <!-- Feedback -->
      <label for="msg">Feedback:</label>
      <textarea id="msg" placeholder="Write your feedback"></textarea>

      <!-- Flipped Toggle Switch -->
      <label for="recommend">Recommend our service?</label>
      <select id="recommend" data-role="slider" data-flip="true">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>

      <!-- Another Toggle Example -->
      <label for="satisfied">Are you satisfied?</label>
      <select id="satisfied" data-role="slider" data-flip="true">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>

      <!-- Submit Button -->
      <button class="ui-btn ui-btn-b">Submit</button>

    </form>
  </div>

  <!-- FOOTER -->
  <div data-role="footer">
    <h4>Thank you!</h4>
  </div>

</div>

</body>
</html>
