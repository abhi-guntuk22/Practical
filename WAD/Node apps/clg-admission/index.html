<!DOCTYPE html>
<html>
<head>
  <title>College Admission</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      text-align: center;
    }

    .container {
      width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    input {
      width: 90%;
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 8px 12px;
      margin: 5px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .delete-btn {
      background: red;
    }

    .update-btn {
      background: green;
    }

    li {
      margin: 10px;
      list-style: none;
      background: #eee;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Add / Update Student</h2>

  <input id="name" placeholder="Name"><br>
  <input id="email" placeholder="Email"><br>
  <input id="course" placeholder="Course"><br>
  <input id="marks" placeholder="Marks"><br>

  <button onclick="addStudent()">Save Student</button>

  <h2>Students List</h2>
  <ul id="list"></ul>
</div>

<script>
const API = "http://localhost:3000/students";

let editId = null; // 🔥 track which student is being edited

// CREATE or UPDATE
function addStudent() {
  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    course: document.getElementById("course").value,
    marks: Number(document.getElementById("marks").value)
  };

  if (editId) {
    // 🔁 UPDATE
    fetch(API + "/" + editId, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(() => {
      editId = null;
      loadStudents();
      clearForm();
    });

  } else {
    // ➕ CREATE
    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(() => {
      loadStudents();
      clearForm();
    });
  }
}

// READ
function loadStudents() {
  fetch(API)
    .then(res => res.json())
    .then(data => {
      list.innerHTML = "";
      data.forEach(s => {
        list.innerHTML += `
          <li>
            <b>${s.name}</b> - ${s.course} (${s.marks})
            <br>
            <button class="update-btn" onclick="editStudent('${s._id}','${s.name}','${s.email}','${s.course}','${s.marks}')">Edit</button>
            <button class="delete-btn" onclick="deleteStudent('${s._id}')">Delete</button>
          </li>`;
      });
    });
}

// DELETE
function deleteStudent(id) {
  fetch(API + "/" + id, { method: "DELETE" })
    .then(() => loadStudents());
}

// 🔥 EDIT FUNCTION
function editStudent(id, name, email, course, marks) {
  document.getElementById("name").value = name;
  document.getElementById("email").value = email;
  document.getElementById("course").value = course;
  document.getElementById("marks").value = marks;

  editId = id; // store id for update
}

// clear form
function clearForm() {
  document.getElementById("name").value = "";
  document.getElementById("email").value = "";
  document.getElementById("course").value = "";
  document.getElementById("marks").value = "";
}

loadStudents();
</script>

</body>
</html>
