<!DOCTYPE html>
<html>
<head>
    <title>Student Tables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Information</h1>

    <div class="container">

        <!-- Left Table -->
        <table>
            <caption>Results</caption>
            <tr>
                <th>Student Name</th>
                <th>Result</th>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>Pass</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>Fail</td>
            </tr>

            <tr>
                <td>Amit</td>
                <td>Pass</td>
            </tr>
        </table>

        <!-- Right Table -->
        <table>
            <caption>CGPA</caption>

            <tr>
                <th>Student Name</th>
                <th>CGPA</th>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>8.5</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>6.2</td>
            </tr>

            <tr>
                <td>Amit</td>
                <td>9.1</td>
            </tr>

        </table>

    </div>

</body>
</html>
