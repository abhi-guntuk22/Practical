<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tourist Places of India</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h1 class="text-center mb-4">Tourist Places of India</h1>

    <!-- Carousel -->
    <div id="tourCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="https://punetourism.co.in/images/places-to-visit/headers/shaniwar-wada-pune-tourism-entry-fee-timings-holidays-reviews-header.jpg" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Taj Mahal</h3>
                    <p>Located in Agra, symbol of love.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://thumbs.dreamstime.com/b/heritage-monument-aga-khan-palace-pune-268637741.jpg" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Goa</h3>
                    <p>Famous for beaches and nightlife.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://tse4.mm.bing.net/th/id/OIP.Gtymze47UVLf8k5XIaEUSwHaDt?pid=Api&P=0&h=180" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Jaipur</h3>
                    <p>Known as the Pink City.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="images/kerala.jpg" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Kerala</h3>
                    <p>Famous for backwaters and greenery.</p>
                </div>
            </div>

        </div>

        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#tourCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#tourCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
