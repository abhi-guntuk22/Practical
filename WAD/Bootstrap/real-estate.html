<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Dream Home Real Estate</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .hero{
            background: linear-gradient(to right, #264653, #2a9d8f);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .property-card{
            transition: transform 0.3s;
        }

        .property-card:hover{
            transform: scale(1.05);
        }

        footer{
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

    </style>

</head>
<body>

    <!-- Header -->
    <div class="hero">

        <h1>🏠 Dream Home Real Estate</h1>

        <p>Find Your Perfect Property</p>

    </div>

    <!-- Property Section -->
    <div class="container mt-5">

        <div class="row">

            <!-- Property 1 -->
            <div class="col-md-4 mb-4">

                <div class="card property-card shadow">

                    <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994"
                    class="card-img-top"
                    height="250">

                    <div class="card-body">

                        <h4>Luxury Villa</h4>

                        <p>
                            📍 Mumbai, Maharashtra
                        </p>

                        <p>
                            💰 Price: ₹2.5 Crore
                        </p>

                        <button class="btn btn-success w-100"
                        onclick="contactUs()">

                            Contact Us

                        </button>

                    </div>

                </div>

            </div>

            <!-- Property 2 -->
            <div class="col-md-4 mb-4">

                <div class="card property-card shadow">

                    <img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be"
                    class="card-img-top"
                    height="250">

                    <div class="card-body">

                        <h4>Modern Apartment</h4>

                        <p>
                            📍 Pune, Maharashtra
                        </p>

                        <p>
                            💰 Price: ₹85 Lakhs
                        </p>

                        <button class="btn btn-success w-100"
                        onclick="contactUs()">

                            Contact Us

                        </button>

                    </div>

                </div>

            </div>

            <!-- Property 3 -->
            <div class="col-md-4 mb-4">

                <div class="card property-card shadow">

                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c"
                    class="card-img-top"
                    height="250">

                    <div class="card-body">

                        <h4>Family House</h4>

                        <p>
                            📍 Nashik, Maharashtra
                        </p>

                        <p>
                            💰 Price: ₹1.2 Crore
                        </p>

                        <button class="btn btn-success w-100"
                        onclick="contactUs()">

                            Contact Us

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Contact Message -->
    <div class="container mt-4 text-center">

        <div id="contactInfo"></div>

    </div>

    <!-- Footer -->
    <footer>

        <p>
            © 2026 Dream Home Real Estate
        </p>

    </footer>

    <!-- JavaScript -->
    <script>

        function contactUs(){

            document.getElementById("contactInfo")
            .innerHTML = `

                <div class="alert alert-info">

                    <h4>Contact Information</h4>

                    <p>📞 +91 9876543210</p>

                    <p>✉ dreamhome@gmail.com</p>

                    <p>📍 Pune, Maharashtra</p>

                </div>

            `;
        }

    </script>

</body>
</html>
