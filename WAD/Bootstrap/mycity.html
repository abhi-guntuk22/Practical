<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My City - Pune</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      text-align: center;
    }

    h1 {
      font-size: 50px;
      margin-top: 20px;
      color: #0d6efd;
      font-weight: bold;
    }

    .landmark {
      font-size: 24px;
      margin: 10px;
    }

    #display-box img {
      width: 100%;
      max-width: 500px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MYCITY</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon">$</span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Landmarks</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ✅ City Name -->
  <h1>PUNE CITY</h1>

  <!-- ✅ Landmarks with different styles -->
  <div class="container">
    <p class="landmark" style="color:red; font-family: cursive;">Shaniwar Wada</p>
    <p class="landmark" style="color:green; font-family: monospace;">Aga Khan Palace</p>
    <p class="landmark" style="color:purple; font-family: fantasy;">Sinhagad Fort</p>
  </div>

  <!-- ✅ Buttons -->
  <div class="container mt-3">
    <button class="btn btn-danger m-2" onclick="showLandmark('wada')">Shaniwar Wada</button>
    <button class="btn btn-success m-2" onclick="showLandmark('palace')">Aga Khan Palace</button>
    <button class="btn btn-dark m-2" onclick="showLandmark('fort')">Sinhagad Fort</button>
  </div>

  <!-- ✅ Display Area -->
  <div id="display-box" class="container mt-4"></div>

  <!-- ✅ JavaScript -->
  <script>
    function showLandmark(place) {
      const box = document.getElementById("display-box");

      if (place === "wada") {
        box.innerHTML = `
          <h3>Shaniwar Wada</h3>
          <img src="https://punetourism.co.in/images/places-to-visit/headers/shaniwar-wada-pune-tourism-entry-fee-timings-holidays-reviews-header.jpg">
          <p>Historic fortification in Pune built in 1732.</p>
        `;
      }

      else if (place === "palace") {
        box.innerHTML = `
          <h3>Aga Khan Palace</h3>
          <img src="https://thumbs.dreamstime.com/b/heritage-monument-aga-khan-palace-pune-268637741.jpg">
          <p>Important historical landmark related to Mahatma Gandhi.</p>
        `;
      }

      else if (place === "fort") {
        box.innerHTML = `
          <h3>Sinhagad Fort</h3>
          <img src="https://tse4.mm.bing.net/th/id/OIP.Gtymze47UVLf8k5XIaEUSwHaDt?pid=Api&P=0&h=180">
          <p>Popular trekking destination with great history.</p>
        `;
      }
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
