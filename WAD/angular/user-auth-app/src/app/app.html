<nav class="navbar">
  <div class="nav-brand">Nexus</div>
  <div class="nav-links">
    @if (!auth.currentUser()) {
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Login</a>
      <a routerLink="/register" routerLinkActive="active" class="nav-link">Register</a>
    } @else {
      <a routerLink="/profile" routerLinkActive="active" class="nav-link">Profile</a>
      <a (click)="logout()" routerLink="/" class="nav-link" style="cursor: pointer;">Logout</a>
    }
  </div>
</nav>

<router-outlet></router-outlet>
