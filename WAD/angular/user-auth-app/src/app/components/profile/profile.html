<div class="auth-container animate-fade-in">
  <div class="card card-profile">
    <div class="profile-header">
      <div class="avatar">{{ auth.currentUser()?.name?.charAt(0) || 'S' }}</div>
      <div class="profile-info">
        <h3>{{ auth.currentUser()?.name }}</h3>
        <p>{{ auth.currentUser()?.joined || 'Member since Apr 14, 2026' }}</p>
      </div>
    </div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h4 style="color: #ffffff; font-weight: 500; font-size: 1.1rem;">Personal Information</h4>
      <button class="btn-primary" style="width: auto; margin: 0; padding: 0.5rem 1rem; border-radius: 4px;" (click)="toggleEdit()">
        {{ isEditing() ? 'Save Profile' : 'Edit Profile' }}
      </button>
    </div>

    @if (successMessage()) {
      <div style="background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #22c55e; padding: 10px; border-radius: 4px; margin-bottom: 1.5rem;">
        {{ successMessage() }}
      </div>
    }

    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [value]="auth.currentUser()?.name" disabled style="opacity: 0.7;">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [value]="auth.currentUser()?.email" disabled style="opacity: 0.7;">
      </div>
    </div>

    <div class="form-group">
      <label>Bio...</label>
      <textarea [disabled]="!isEditing()" [ngModel]="bioDraft()" (ngModelChange)="bioDraft.set($event)" rows="3" [style.opacity]="isEditing() ? '1' : '0.7'" style="resize: none;">
      </textarea>
    </div>
  </div>
</div>
