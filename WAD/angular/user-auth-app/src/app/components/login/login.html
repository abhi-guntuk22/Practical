<div class="auth-container animate-fade-in">
  <div class="card">
    <h2>Welcome Back</h2>
    <p class="card-subtitle">Sign in to your Nexus account to continue.</p>

    @if (error()) {
      <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 10px; border-radius: 4px; margin-bottom: 1rem;">
        {{ error() }}
      </div>
    }

    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" placeholder="shravan@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
      
      <div class="text-center mt-4">
        <span class="text-muted">Don't have an account? <a routerLink="/register" class="link">Register here</a></span>
      </div>
    </form>
  </div>
</div>
