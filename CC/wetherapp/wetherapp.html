<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Weather Forecast App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
}

.container{
    width:380px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    color:white;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    font-size:32px;
    font-weight:700;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.search-box input{
    flex:1;
    padding:12px 15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:15px;
}

.search-box input::placeholder{
    color:#ddd;
}

.search-box button{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#00c6ff;
    color:white;
    cursor:pointer;
    font-size:18px;
    transition:0.3s;
}

.search-box button:hover{
    background:#0072ff;
    transform:scale(1.05);
}

.weather-box{
    text-align:center;
}

.weather-icon{
    font-size:90px;
    margin-bottom:10px;
}

.temperature{
    font-size:55px;
    font-weight:600;
}

.description{
    font-size:20px;
    margin-top:5px;
    margin-bottom:20px;
    color:#e0e0e0;
}

.location{
    font-size:18px;
    margin-bottom:25px;
}

.details{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.card{
    width:48%;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
    text-align:center;
}

.card h3{
    font-size:16px;
    margin-bottom:8px;
}

.card p{
    font-size:20px;
    font-weight:600;
}

.footer{
    margin-top:25px;
    text-align:center;
    font-size:13px;
    color:#ccc;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>Weather App</h1>
    </div>

    <div class="search-box">
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">🔍</button>
    </div>

    <div class="weather-box">

        <div class="weather-icon">
            ☀️
        </div>

        <div class="temperature" id="temp">
            28°C
        </div>

        <div class="description" id="desc">
            Sunny
        </div>

        <div class="location" id="location">
            Pune, India
        </div>

        <div class="details">

            <div class="card">
                <h3>Humidity</h3>
                <p id="humidity">65%</p>
            </div>

            <div class="card">
                <h3>Wind</h3>
                <p id="wind">12 km/h</p>
            </div>

        </div>

    </div>

    <div class="footer">
        Weather Forecast Web App
    </div>

</div>

<script>

function getWeather(){

    let city = document.getElementById("city").value;

    if(city===""){
        alert("Please enter city name");
        return;
    }

    // Dummy Data UI Update

    document.getElementById("location").innerHTML = city + ", India";

    let temps = [22,25,28,30,32,26];
    let weather = ["Cloudy","Sunny","Rainy","Storm","Clear Sky"];
    let humidity = [55,60,65,70,80];
    let wind = [10,12,14,8,16];

    let random = Math.floor(Math.random()*5);

    document.getElementById("temp").innerHTML =
        temps[random] + "°C";

    document.getElementById("desc").innerHTML =
        weather[random];

    document.getElementById("humidity").innerHTML =
        humidity[random] + "%";

    document.getElementById("wind").innerHTML =
        wind[random] + " km/h";

}

</script>

</body>
</html>
